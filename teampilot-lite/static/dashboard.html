<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>teampilot-lite · 看板</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #1f2937; }
    header { background: #fff; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    header h1 { font-size: 16px; margin: 0; }
    .live { font-size: 12px; padding: 3px 8px; border-radius: 10px; background: #e5e7eb; color: #6b7280; }
    .live.on { background: #dcfce7; color: #16a34a; }
    main { max-width: 760px; margin: 24px auto; padding: 0 16px; }
    .add { display: flex; gap: 8px; margin-bottom: 20px; }
    .add input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
    .add button { padding: 8px 16px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { background: #fff; padding: 12px 16px; border-radius: 8px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    .title { font-size: 14px; }
    .status { font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-left: 8px; background: #eef2ff; color: #4f46e5; }
    .assignee { font-size: 12px; color: #6b7280; margin-left: 8px; }
    .del { border: 0; background: transparent; color: #dc2626; cursor: pointer; font-size: 13px; }
    .upload { display: flex; gap: 8px; align-items: center; margin-bottom: 20px; padding: 12px 16px; background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    .upload button { padding: 6px 14px; border: 0; border-radius: 6px; background: #059669; color: #fff; cursor: pointer; }
    .upload-result { font-size: 12px; color: #059669; margin-left: 8px; }
    /* 删除确认弹窗 */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: center; justify-content: center; }
    .overlay.open { display: flex; }
    .modal { background: #fff; padding: 24px; border-radius: 10px; width: 300px; }
    .modal h2 { font-size: 15px; margin: 0 0 8px; }
    .modal p { font-size: 13px; color: #6b7280; margin: 0 0 20px; }
    .modal .actions { display: flex; gap: 8px; justify-content: flex-end; }
    .modal button { padding: 7px 16px; border-radius: 6px; border: 0; cursor: pointer; }
    .modal .cancel { background: #e5e7eb; color: #374151; }
    .modal .confirm { background: #dc2626; color: #fff; }
  </style>
</head>
<body>
  <header>
    <h1>团队看板</h1>
    <div>
      <span class="live" data-testid="sse-status" id="live">● 实时连接中…</span>
      <button data-testid="logout" id="logout" style="margin-left:12px;border:0;background:transparent;cursor:pointer;color:#6b7280;">退出</button>
    </div>
  </header>
  <main>
    <div class="add">
      <input data-testid="new-item-title" id="newTitle" placeholder="新建工作项标题…" />
      <button data-testid="add-item" id="addBtn">添加</button>
    </div>

    <div class="upload">
      <span style="font-size:13px;">上传附件：</span>
      <input type="file" data-testid="file-input" id="fileInput" />
      <button data-testid="upload-submit" id="uploadBtn">上传</button>
      <span class="upload-result" data-testid="upload-result" id="uploadResult"></span>
    </div>

    <ul data-testid="item-list" id="list"></ul>
  </main>

  <!-- 删除确认弹窗：默认隐藏，点删除时弹出 -->
  <div class="overlay" data-testid="confirm-modal" id="modal">
    <div class="modal">
      <h2>确认删除</h2>
      <p data-testid="confirm-text" id="confirmText">确定要删除这个工作项吗？</p>
      <div class="actions">
        <button class="cancel" data-testid="cancel-delete" id="cancelBtn">取消</button>
        <button class="confirm" data-testid="confirm-delete" id="confirmBtn">删除</button>
      </div>
    </div>
  </div>

  <script>
    const list = document.getElementById("list");

    function render(items) {
      list.innerHTML = "";
      for (const it of items) {
        const li = document.createElement("li");
        li.dataset.testid = "item-" + it.id;
        li.dataset.itemId = it.id;
        li.innerHTML =
          `<span><span class="title">${it.title}</span>` +
          `<span class="status">${it.status}</span>` +
          `<span class="assignee">@${it.assignee}</span></span>` +
          `<button class="del" data-testid="delete-${it.id}">删除</button>`;
        li.querySelector(".del").addEventListener("click", () => askDelete(it.id));
        list.appendChild(li);
      }
    }

    async function load() {
      const res = await fetch("/api/items");
      if (res.status === 401) { window.location.href = "/login"; return; }
      const data = await res.json();
      render(data.items);
    }

    async function add() {
      const title = document.getElementById("newTitle").value.trim();
      if (!title) return;
      await fetch("/api/items", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title }),
      });
      document.getElementById("newTitle").value = "";
      // 不手动刷新列表 —— 交给 SSE 推回来,证明实时链路真的通
    }

    // --- 删除：先弹确认框，确认后才真正删 ---
    const modal = document.getElementById("modal");
    let pendingDeleteId = null;

    function askDelete(id) {
      pendingDeleteId = id;
      modal.classList.add("open");
    }
    document.getElementById("cancelBtn").addEventListener("click", () => {
      pendingDeleteId = null;
      modal.classList.remove("open");
    });
    document.getElementById("confirmBtn").addEventListener("click", async () => {
      if (pendingDeleteId != null) {
        await fetch("/api/items/" + pendingDeleteId, { method: "DELETE" });
      }
      pendingDeleteId = null;
      modal.classList.remove("open");
      // 删除后列表交给 SSE 推回来刷新
    });

    // --- 文件上传 ---
    document.getElementById("uploadBtn").addEventListener("click", async () => {
      const input = document.getElementById("fileInput");
      const result = document.getElementById("uploadResult");
      if (!input.files.length) { result.textContent = "请先选择文件"; return; }
      const fd = new FormData();
      fd.append("file", input.files[0]);
      const res = await fetch("/api/upload", { method: "POST", body: fd });
      const data = await res.json();
      result.textContent = `已上传：${data.filename}（${data.size} 字节）`;
    });

    document.getElementById("addBtn").addEventListener("click", add);
    document.getElementById("logout").addEventListener("click", async () => {
      await fetch("/api/logout", { method: "POST" });
      window.location.href = "/login";
    });

    // --- SSE:订阅服务器推送,任何增删改都实时反映到页面 ---
    const es = new EventSource("/api/stream");
    const live = document.getElementById("live");
    es.addEventListener("hello", () => {
      live.textContent = "● 实时已连接";
      live.classList.add("on");
    });
    es.onmessage = () => { load(); };   // 收到变更就重新拉列表(简单可靠)
    es.onerror = () => {
      live.textContent = "● 连接断开,重连中…";
      live.classList.remove("on");
    };

    load();
  </script>
</body>
</html>
