<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>teampilot-lite · 登录</title>
  <style>
    body { font-family: system-ui, sans-serif; display: grid; place-items: center; height: 100vh; margin: 0; background: #f4f5f7; }
    .card { background: #fff; padding: 32px; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.08); width: 300px; }
    h1 { font-size: 18px; margin: 0 0 20px; }
    label { display: block; font-size: 13px; color: #555; margin: 12px 0 4px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
    button { width: 100%; margin-top: 20px; padding: 10px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; font-size: 14px; cursor: pointer; }
    .error { color: #dc2626; font-size: 13px; margin-top: 12px; min-height: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>团队看板 · 登录</h1>
    <label>用户名</label>
    <input data-testid="login-username" id="username" autocomplete="username" />
    <label>密码</label>
    <input data-testid="login-password" id="password" type="password" autocomplete="current-password" />
    <button data-testid="login-submit" id="submit">登录</button>
    <div class="error" data-testid="login-error" id="error"></div>
  </div>
  <script>
    document.getElementById("submit").addEventListener("click", async () => {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const err = document.getElementById("error");
      err.textContent = "";
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      if (res.ok) {
        window.location.href = "/dashboard";
      } else {
        const data = await res.json();
        err.textContent = data.error || "登录失败";
      }
    });
  </script>
</body>
</html>
